name: build

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to HEC Nexus (uses the version in build.gradle.kts)"
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Pin the Gradle 25 toolchain to the x64 JDK that setup-java installed. Without this,
      # auto-detection on macos-latest (arm64) could pick a pre-installed arm64 JDK, and the
      # resulting arm64 JVM cannot load the bundled x86_64 hecdss dylib.
      GRADLE_OPTS: >-
        -Dorg.gradle.java.installations.auto-detect=false
        -Dorg.gradle.java.installations.auto-download=false
        -Dorg.gradle.java.installations.fromEnv=JAVA_HOME
    steps:
      - uses: actions/checkout@v4
      # Only an x86_64 macOS native is shipped; run it under Rosetta on the arm64 runner
      # so the x64 JVM loads it cleanly.
      - name: Ensure Rosetta 2 (macOS)
        if: runner.os == 'macOS'
        run: softwareupdate --install-rosetta --agree-to-license
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          architecture: x64
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test, verify API snapshot + javadoc
        run: ./gradlew check --stacktrace

  publish:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-latest
    # Nexus write creds live on this protected environment, not as plain repo secrets — so they
    # are exposed only to this deploy job and can require approval / branch restrictions.
    environment: nexus-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish to HEC Nexus
        # nexusUser / nexusPassword are read as Gradle project properties; the
        # ORG_GRADLE_PROJECT_ prefix maps these env vars to them without putting
        # secrets on the command line. Add NEXUS_USER / NEXUS_PASSWORD repo secrets.
        env:
          ORG_GRADLE_PROJECT_nexusUser: ${{ secrets.NEXUS_USER }}
          ORG_GRADLE_PROJECT_nexusPassword: ${{ secrets.NEXUS_PASSWORD }}
        run: ./gradlew publish --stacktrace
